name: PR57 prebuilt read-only credential diagnostic
on:
  push:
    branches: [codex/pr57-prebuilt-publish]
permissions:
  contents: read
concurrency:
  group: pr57-qa-publication-598bb3f
  cancel-in-progress: false
jobs:
  diagnose:
    if: github.repository == 'CaBsCrypto/carmelita' && github.ref == 'refs/heads/codex/pr57-prebuilt-publish' && github.run_attempt == 1
    environment: pr57-qa-publication
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Use the pinned runtime
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020
        with:
          node-version: 24.14.0
      - name: Install the public pinned CLI without credentials
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const userConfig=path.join(process.env.RUNNER_TEMP,'pr57-diag-npm-user');
          const globalConfig=path.join(process.env.RUNNER_TEMP,'pr57-diag-npm-global');
          fs.writeFileSync(userConfig,''); fs.writeFileSync(globalConfig,'');
          const env={PATH:process.env.PATH,CI:'true',NPM_CONFIG_USERCONFIG:userConfig,NPM_CONFIG_GLOBALCONFIG:globalConfig,NPM_CONFIG_AUDIT:'false',NPM_CONFIG_FUND:'false'};
          execFileSync('npm',['install','--global','--prefix',path.join(process.env.RUNNER_TEMP,'pr57-diag-tools'),'vercel@58.9.4','--no-audit','--no-fund'],{env,stdio:'inherit',timeout:300_000});
          NODE
      - name: Read only authentication metadata and CLI whoami
        env:
          CARMELITA_QA_VERCEL_TOKEN: ${{ secrets.CARMELITA_QA_VERCEL_TOKEN }}
        shell: bash
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import path from 'node:path';
          import {execFileSync} from 'node:child_process';
          const token=process.env.CARMELITA_QA_VERCEL_TOKEN;
          if(!token || !/^[\x21-\x7e]{16,4096}$/.test(token)) throw new Error('diagnostic_credential_missing_or_invalid');
          const safeCode = value => typeof value==='string' && /^[A-Za-z0-9_-]{1,80}$/.test(value) ? value : null;
          const proof={readOnly:true,deploymentCommandInvoked:false,tokenMatchesCliSyntax:! /\W/.test(token),checkedAt:new Date().toISOString(),requests:[],whoami:null};
          for(const pathname of ['/v2/user','/v1/teams','/v2/teams/team_XjolcoWJ9V9yamVnCdpC7EMY']) {
            const response=await fetch(`https://api.vercel.com${pathname}`,{redirect:'error',signal:AbortSignal.timeout(15_000),headers:{Authorization:`Bearer ${token}`}});
            const body=await response.json();
            proof.requests.push({pathname,status:response.status,errorCode:safeCode(body.error?.code),userPresent:Boolean(body.user?.uid),teamPresent:Boolean(body.id),teamCount:Array.isArray(body.teams)?body.teams.length:null});
          }
          const config=path.join(process.env.RUNNER_TEMP,'pr57-diag-global-config');
          fs.mkdirSync(config,{recursive:true});
          const env={PATH:`${path.join(process.env.RUNNER_TEMP,'pr57-diag-tools/bin')}:${process.env.PATH}`,CI:'true',LANG:'C.UTF-8',VERCEL_TOKEN:token,VERCEL_TELEMETRY_DISABLED:'1'};
          function parsedSafe(raw) {try {const value=JSON.parse(raw);return {status:safeCode(value.status),errorCode:safeCode(value.error?.code)};}catch{return null;}}
          try {
            const raw=execFileSync('vercel',['whoami','--scope','team_XjolcoWJ9V9yamVnCdpC7EMY','--non-interactive','--json','--global-config',config],{env,encoding:'utf8',stdio:['ignore','pipe','pipe'],timeout:30_000,maxBuffer:1_048_576});
            proof.whoami={exitCode:0,result:parsedSafe(raw)};
          } catch(error) {
            const combined=String(error.stdout??'')+'\n'+String(error.stderr??'');
            proof.whoami={exitCode:typeof error.status==='number'?error.status:null,result:parsedSafe(String(error.stdout??'')),reason:/No existing credentials|No token found|not logged/i.test(combined)?'credentials_missing':/scope.*(not found|not exist)|not.*(found|exist).*scope/i.test(combined)?'scope_unavailable':/forbidden|not authorized|not allowed/i.test(combined)?'access_denied':/Invalid token|invalid.*token/i.test(combined)?'invalid_token':null};
          }
          fs.mkdirSync('diagnostic-proof',{recursive:true});
          fs.writeFileSync('diagnostic-proof/metadata.json',JSON.stringify(proof,null,2));
          console.log(JSON.stringify(proof));
          NODE
      - name: Retain sanitized diagnostic metadata only
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: pr57-prebuilt-readonly-diagnostic-${{ github.run_id }}
          path: diagnostic-proof/metadata.json
          if-no-files-found: ignore
          retention-days: 2
